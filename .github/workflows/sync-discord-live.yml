name: Sync active Discord website

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-discord-live.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and install source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663923349545/ljJyHJNNSzmxZwaW.zip' -o /tmp/source.zip
          echo '9ec4c4fed687678c8df89f874743a09fdbc0587ccab90dfc0d3564f74333fd79  /tmp/source.zip' | sha256sum -c -
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -f .github/workflows/sync-discord-live.yml
          rmdir .github/workflows .github 2>/dev/null || true
      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Activate Discord OAuth and official server invite'
          git push
