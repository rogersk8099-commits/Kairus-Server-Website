name: Sync final website source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-final.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and replace source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663923349545/ACQaYccymdBwfNgD.zip' -o /tmp/source.zip
          echo '6b72643aef8dcd991dc7442e317f8e7b3fe0f31625575968c53c2530fd256c39  /tmp/source.zip' | sha256sum -c -
          temp=$(mktemp -d)
          unzip -q /tmp/source.zip -d "$temp"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$temp"/. .
          rm -f .github/workflows/sync-final.yml
          git config user.name 'Kairu Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Add Discord OAuth, favicon, and production login guard'
          git push
