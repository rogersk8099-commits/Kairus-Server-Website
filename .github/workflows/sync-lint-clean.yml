name: Sync lint-clean website source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-lint-clean.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and replace source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663923349545/GPSyWfrBqSXcrhCA.zip' -o /tmp/source.zip
          echo '35cb65d83c65fa6db8f2360962426bd266e2679e5ddc89aa31e427bf758e4ce5  /tmp/source.zip' | sha256sum -c -
          temp=$(mktemp -d)
          unzip -q /tmp/source.zip -d "$temp"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$temp"/. .
          rm -f .github/workflows/sync-lint-clean.yml
          git config user.name 'Kairu Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Format Discord login component'
          git push
